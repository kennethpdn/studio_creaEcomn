<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Créatif IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-8">
    
    <div class="max-w-3xl mx-auto bg-white rounded-3xl shadow-sm border border-gray-200 p-8 mt-10">
        <!-- En-tête -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">Studio Créatif IA</h1>
            <div class="bg-gray-100 px-5 py-2 rounded-full font-medium text-sm">
                Solde : <span id="solde">10.00</span> $
            </div>
        </div>

        <!-- Zone de création -->
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Décrivez votre vidéo ou cartoon</label>
                <textarea id="prompt" rows="4" class="w-full border border-gray-300 rounded-2xl p-4 focus:ring-2 focus:ring-black focus:border-black outline-none transition-all" placeholder="Un chat astronaute marchant sur Mars, style dessin animé 3D..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Modèle de génération</label>
                <select id="model" class="w-full border border-gray-300 rounded-2xl p-4 focus:ring-2 focus:ring-black outline-none transition-all appearance-none bg-white">
                    <option value="kling_3">Kling 3.0 (Réalisme & Mouvement)</option>
                    <option value="minimax_h3">MiniMax H3 (Cinématique)</option>
                    <option value="cartoon_model">Toon/Anime (Animation)</option>
                </select>
            </div>

            <!-- Bouton totalement arrondi selon vos instructions -->
            <button id="generateBtn" class="w-full bg-black text-white font-semibold py-4 rounded-full hover:bg-gray-800 transition-colors shadow-lg">
                Générer la création
            </button>
        </div>

        <!-- Lecteur Vidéo (Caché par défaut) -->
        <div id="videoContainer" class="mt-12 hidden">
            <h2 class="text-lg font-bold mb-4">Aperçu</h2>
            <div class="aspect-video bg-gray-100 rounded-2xl flex items-center justify-center border-2 border-dashed border-gray-300 relative overflow-hidden">
                <div id="loader" class="animate-pulse flex flex-col items-center">
                    <div class="h-10 w-10 border-4 border-gray-300 border-t-black rounded-full animate-spin mb-3"></div>
                    <p class="text-gray-500 font-medium" id="statusText">Création en cours...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Logique de simulation en attendant Higgsfield
        document.getElementById('generateBtn').addEventListener('click', () => {
            const btn = document.getElementById('generateBtn');
            const container = document.getElementById('videoContainer');
            const status = document.getElementById('statusText');
            
            // Afficher le loader
            container.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            btn.innerText = "Génération...";

            // Simuler l'appel à votre backend Vercel (qui déduira l'argent sur Firebase)
            setTimeout(() => {
                status.innerText = "Attente du rendu par l'IA...";
                
                // Simuler la réception du Webhook après quelques secondes
                setTimeout(() => {
                    document.getElementById('loader').innerHTML = `
                        <video controls class="w-full h-full object-cover rounded-xl" autoplay loop muted>
                            <!-- Une vidéo de test libre de droits pour la simulation -->
                            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                        </video>
                    `;
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    btn.innerText = "Générer la création";
                    
                    // Simuler la mise à jour du solde front-end
                    let currentSolde = parseFloat(document.getElementById('solde').innerText);
                    document.getElementById('solde').innerText = (currentSolde - 1.12).toFixed(2);
                }, 4000);
                
            }, 1000);
        });
    </script>
</body>
</html>
